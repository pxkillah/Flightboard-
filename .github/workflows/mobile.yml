name: Mobile app

# Builds the iOS and Android apps (unsigned) to prove they still compile. Signing and store
# uploads happen on the owner's Mac (docs/app-release.md). The Mac runner costs ten times the
# Linux minutes, so this runs only when the app's own files or the page code change.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'native.js'
      - 'app.js'
      - 'index.html'
      - 'src/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync -- android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run sync -- ios
      - run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios/App
