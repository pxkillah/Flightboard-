# Calls the real NHTSA APIs once a day, and on pull requests that change the code that talks
# to them. A failed run means NHTSA is down or changed its format; see docs/runbook.md.
# GitHub emails the repo owner when a scheduled run fails. Not a required check, since an
# NHTSA outage shouldn't block unrelated merges.
name: Live NHTSA check

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/http.js'
      - 'src/report.js'
      - 'src/sources/**'
      - 'scripts/live-check.js'
      - '.github/workflows/live-check.yml'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/live-check.js
