# Cloudflare Worker that proxies Car Report's GlobalVIN lookups (see README, "GlobalVIN lookup").
# Deploy from this folder: npx wrangler deploy
name = "car-report-globalvin"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# TODO: GlobalVIN's API host, for example "https://api.globalvin.example" (no trailing slash,
# https only). The Worker calls {GLOBALVIN_BASE_URL}/v1/api/vin. Until it's set, every lookup
# answers 500 "not configured".
GLOBALVIN_BASE_URL = ""
# Comma-separated origins allowed to read answers in a browser. "*" allows any site; lock it
# down before going live, e.g. "https://pxkillah.github.io,capacitor://localhost,https://localhost"
# (the last two are the iOS and Android apps).
ALLOWED_ORIGINS = "*"
# How long a successful answer is cached per VIN, in seconds (default 1 day).
CACHE_TTL_SECONDS = "86400"

# The API key is a secret, never a var and never in this file:
#   npx wrangler secret put GLOBALVIN_API_KEY

# Per-IP limit, so a stranger with the Worker URL can't spend the GlobalVIN calls quickly.
# Remove this block to turn it off; the Worker works without it.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
