<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIN Report</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #5d6470; --line: #e3e6eb;
    --accent: #1d5fd1; --on-accent: #fff; --warn-bg: #fdecec; --warn: #b42318; --ok: #157f3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --card: #171b22; --text: #e8eaee; --muted: #9aa3b0; --line: #2a303a;
            --accent: #6ea0ff; --on-accent: #0b1220; --warn-bg: #3a1714; --warn: #ff8a80; --ok: #5fd08a; }
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto;
         padding: calc(env(safe-area-inset-top, 0px) + 1.25rem) 1rem calc(env(safe-area-inset-bottom, 0px) + 2rem); }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1rem; font-size: .95rem; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; min-width: 0; font: inherit; font-family: ui-monospace, Menlo, monospace; letter-spacing: .04em;
          text-transform: uppercase; padding: .75rem; border: 1px solid var(--line); border-radius: .6rem;
          background: var(--card); color: var(--text); }
  button { font: inherit; font-weight: 600; padding: .75rem 1rem; border: 0; border-radius: .6rem;
           background: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: .6; }
  .hint { color: var(--muted); font-size: .85rem; margin: .4rem 0 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: .8rem; padding: 1rem; margin-top: 1rem; }
  .card h2 { font-size: 1.05rem; margin: 0 0 .5rem; display: flex; justify-content: space-between; gap: .5rem; }
  .count { color: var(--muted); font-weight: 500; }
  .title { font-size: 1.3rem; font-weight: 700; margin: 0; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; margin: .75rem 0 0; font-size: .95rem; }
  dt { color: var(--muted); } dd { margin: 0; }
  .item { border-top: 1px solid var(--line); padding: .65rem 0; }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .meta { color: var(--muted); font-size: .85rem; }
  .item p { margin: .3rem 0 0; font-size: .95rem; }
  .badge { display: inline-block; background: var(--warn-bg); color: var(--warn); font-weight: 700;
           font-size: .8rem; padding: .15rem .45rem; border-radius: .35rem; margin-top: .35rem; }
  .err { color: var(--warn); }
  .none { color: var(--ok); margin: 0; }
  .bar { display: flex; justify-content: space-between; gap: .5rem; font-size: .95rem; padding: .2rem 0; }
  details summary { cursor: pointer; color: var(--accent); font-size: .9rem; margin-top: .3rem; }
  .note { color: var(--muted); font-size: .85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>VIN Report</h1>
  <p class="sub">Recalls, complaints and crash ratings from public NHTSA data.</p>
  <form id="f" autocomplete="off">
    <input id="vin" name="vin" maxlength="20" placeholder="17-character VIN" autocapitalize="characters" spellcheck="false" required>
    <button id="go">Look up</button>
  </form>
  <p class="hint">Find it at the bottom of the windshield on the driver's side, or on the driver's door frame.</p>
  <div id="out" aria-live="polite"></div>
  <p class="card note">Not included: accident, odometer, ownership, lien and service history. That data isn't public; see the
    <a href="https://github.com/pxkillah/Flightboard-#what-it-does-not-include-and-where-that-data-actually-lives">README</a> for where to get it.</p>
</main>
<script type="module">
import { buildReport } from './src/report.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function card(title, body, count) {
  return `<section class="card"><h2><span>${esc(title)}</span>${count == null ? '' : `<span class="count">${count}</span>`}</h2>${body}</section>`;
}

function recallCard(title, list, err) {
  if (err) return card(title, `<p class="err">Couldn't load: ${esc(err)}</p>`);
  if (!list) return '';
  if (!list.length) return card(title, '<p class="none">No recalls found for this model.</p>', 0);
  const items = list.map((r) => `<div class="item">
      <div class="meta">${esc(r.date)} · #${esc(r.campaign)}</div>
      <strong>${esc(r.component)}</strong>
      ${r.parkIt ? '<div><span class="badge">DO NOT DRIVE until repaired</span></div>' : ''}
      ${r.parkOutside ? '<div><span class="badge">Park outside (fire risk)</span></div>' : ''}
      ${r.summary ? `<p>${esc(r.summary)}</p>` : ''}
      ${r.remedy ? `<details><summary>Remedy</summary><p>${esc(r.remedy)}</p></details>` : ''}
    </div>`).join('');
  return card(title, items, list.length);
}

function render(r) {
  if (!r.vinCheck.valid) return card('Check the VIN', `<p class="err">${r.vinCheck.errors.map(esc).join('<br>')}</p>`);
  let html = '';
  const v = r.vehicle;
  if (!v?.make) {
    return card('Vehicle', `<p class="err">Couldn't decode this VIN: ${esc(r.errors.vehicle ?? 'no data returned')}</p>`);
  }
  const rows = [
    ['Body', v.bodyClass], ['Drive', v.driveType], ['Engine', [v.engineCylinders && `${v.engineCylinders} cyl`, v.displacementL && `${Number(v.displacementL).toFixed(1)} L`, v.engineHp && `${v.engineHp} hp`].filter(Boolean).join(' · ')],
    ['Fuel', v.fuelType], ['Transmission', v.transmission], ['GVWR', v.gvwr],
    ['Built', [v.plantCity, v.plantState, v.plantCountry].filter(Boolean).join(', ')],
  ].filter(([, x]) => x);
  html += card('Vehicle', `<p class="title">${esc([v.year, v.make, v.model, v.trim].filter(Boolean).join(' '))}</p>
    <div class="meta">${esc(r.vin)}</div>
    <dl>${rows.map(([k, x]) => `<dt>${esc(k)}</dt><dd>${esc(x)}</dd>`).join('')}</dl>
    ${(v.decodeWarnings ?? []).map((w) => `<p class="meta">⚠ ${esc(w)}</p>`).join('')}`);
  // Transport Canada's API doesn't allow requests from other websites, so link to its own search instead.
  html += card('Recalls in Canada', `<p class="meta">Transport Canada's recall data can't be loaded on this page.</p>
    <p><a href="https://tc.canada.ca/en/road-transportation/motor-vehicle-safety/motor-vehicle-safety-recalls-database" target="_blank" rel="noopener">Check on Transport Canada →</a></p>
    <p class="meta">Search for ${esc([v.make, v.model, v.year].filter(Boolean).join(' · '))}.</p>`);
  html += recallCard('Recalls in the US', r.recallsUS, r.errors.recallsUS);
  if (r.errors.complaints) html += card('Owner complaints', `<p class="err">Couldn't load: ${esc(r.errors.complaints)}</p>`);
  else if (r.complaints) {
    const c = r.complaints;
    html += card('Owner complaints (US)', `<p class="meta">Crashes ${c.crashes} · Fires ${c.fires} · Injuries ${c.injuries} · Deaths ${c.deaths}</p>
      ${c.topComponents.slice(0, 6).map((t) => `<div class="bar"><span>${esc(t.component)}</span><strong>${t.count}</strong></div>`).join('')}`, c.total);
  }
  if (r.errors.safetyRatings) html += card('Crash ratings', `<p class="err">Couldn't load: ${esc(r.errors.safetyRatings)}</p>`);
  else if (r.safetyRatings) {
    html += card('Crash ratings (out of 5)', r.safetyRatings.length
      ? r.safetyRatings.map((s) => `<div class="item"><strong>${esc(s.description)}</strong>
          <div class="meta">Overall ${esc(s.overall)} · Front ${esc(s.frontCrash)} · Side ${esc(s.sideCrash)} · Rollover ${esc(s.rollover)}</div></div>`).join('')
      : '<p class="meta">Not crash-tested by NHTSA.</p>');
  }
  html += '<p class="note">Recalls are matched by year, make and model. Check with a dealer whether this specific vehicle has had the repair done.</p>';
  return html;
}

async function lookup(vin) {
  $('#go').disabled = true;
  $('#out').innerHTML = card('Looking up…', '<p class="meta">Contacting NHTSA. This can take up to 20 seconds.</p>');
  try {
    $('#out').innerHTML = render(await buildReport(vin, { include: { recallsCanada: false } }));
  } catch (e) {
    $('#out').innerHTML = card('Something went wrong', `<p class="err">${esc(e.message)}</p>`);
  } finally {
    $('#go').disabled = false;
  }
}

$('#f').addEventListener('submit', (e) => {
  e.preventDefault();
  const vin = $('#vin').value.trim().toUpperCase();
  history.replaceState(null, '', `?vin=${encodeURIComponent(vin)}`);
  lookup(vin);
});
const initial = new URLSearchParams(location.search).get('vin');
if (initial) { $('#vin').value = initial; lookup(initial); }
</script>
</body>
</html>
